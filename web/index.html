<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rusty Nails — Emscripten spike</title>
<style>
  body { margin: 0; background: #141a24; color: #eee; font-family: sans-serif; }
  canvas { display: block; border: 0; padding: 0; }
</style>
<canvas id="canvas" width="960" height="540" tabindex="0"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  var Module = {
    canvas,
    print: (line) => console.log(line),
    printErr: (line) => console.error(line),
    onAbort: (reason) => console.error('web-spike abort:', reason),
    locateFile: (path, prefix) => prefix + (path.endsWith('.wasm') ? 'web_spike.wasm' : path),
  };
</script>
<script src="web_spike.js"></script>
</html>
