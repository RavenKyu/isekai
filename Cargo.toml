[package]
name = "rusty-nails"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
dev = ["dep:dear-imgui-rs", "dep:dear-imgui-sdl3", "dep:dear-imgui-glow", "dep:rfd"]

[dependencies]
dear-imgui-rs = { version = "=0.22.0", optional = true }
dear-imgui-sdl3 = { version = "=0.22.0", optional = true }
dear-imgui-glow = { version = "=0.22.0", optional = true }
glow = "0.18"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sdl3 = { version = "0.20", features = ["build-from-source"] }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
rfd = { version = "0.18", optional = true }

[patch.crates-io]
dear-imgui-build-support = { path = "third_party/dear-imgui-build-support" }
dear-imgui-sdl3 = { path = "third_party/dear-imgui-sdl3" }
