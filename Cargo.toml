[workspace]
members = [".", "crates/*"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false }
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
winit = "0.30.13"
clap = { version = "4", features = ["derive"] }
web-time = "1"
wgpu = { version = "30.0", features = ["webgl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
raw-window-handle = "0.6"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "rusty-nails"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[features]
dev = ["dep:dear-imgui-rs", "dep:dear-imgui-sdl3", "dep:dear-imgui-glow", "dep:rfd"]

[dependencies]
dear-imgui-rs = { version = "=0.22.0", optional = true }
dear-imgui-sdl3 = { version = "=0.22.0", optional = true }
dear-imgui-glow = { version = "=0.22.0", optional = true }
glow = "0.18"
png.workspace = true
serde.workspace = true
serde_json.workspace = true
isekai-core = { path = "crates/isekai-core" }
sdl3 = { version = "0.20", features = ["build-from-source"] }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
rfd = { version = "0.18", optional = true }

[patch.crates-io]
dear-imgui-build-support = { path = "third_party/dear-imgui-build-support" }
dear-imgui-sdl3 = { path = "third_party/dear-imgui-sdl3" }
