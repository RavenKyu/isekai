[package]
name = "isekai"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true

[features]
dev = ["dep:isekai-editor"]

[dependencies]
isekai-editor = { path = "../isekai-editor", optional = true }
isekai-core = { path = "../isekai-core" }
isekai-render = { path = "../isekai-render" }
wgpu.workspace = true
winit.workspace = true
clap.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location", "UrlSearchParams", "console"] }
