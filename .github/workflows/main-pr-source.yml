name: Main PR source

# main은 develop 또는 hotfix/* 브랜치의 PR만 받는다.
# 이 검사는 main ruleset의 필수 상태 검사(source-branch)로 걸려 있다.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Allow only develop and hotfix/* into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::main은 이 저장소의 브랜치에서 온 PR만 받습니다 (받은 곳: $HEAD_REPO)."
            exit 1
          fi
          case "$HEAD_REF" in
            develop|hotfix/*) echo "허용: $HEAD_REF -> main" ;;
            *)
              echo "::error::main은 develop 또는 hotfix/* 브랜치의 PR만 받습니다 (받은 브랜치: $HEAD_REF)."
              exit 1
              ;;
          esac
